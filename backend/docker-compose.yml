version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: proy-volley-db
    env_file:
      - compose/local.env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-proy_volley}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: proy-volley-app
    env_file:
      - compose/local.env
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "7000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app_prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: proy-volley-app-prod
    env_file:
      - compose/prod.env
    command: >
      sh -c "
        python manage.py migrate &&
        python -m gunicorn core.wsgi:application -c /app/gunicorn_conf.py
      "
    ports:
      - "7000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
